name: Arch CI tests

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel previous runs on the same PR to avoid unnecessary minutes.
# Create emails and X in the git interface as a minor side effect.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OSS_CAD_DOWNLOAD_URL: https://github.com/YosysHQ/oss-cad-suite-build/releases/download

      OSS_CAD_VERSION: "2026-08-26"

      # For a CI to be usable, it should be reproducible. This env var is parsed
      # by SpinalHDL simulation engine and used ass seed for simRandom. This insure
      # deterministic simulation failures.
      SPINAL_SIM_SEED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # TODO fix multiple checkout of SpinalHDL
          submodules: recursive

      # No apt install as liblz4 is on the image

      - name: Use the Temurin 21 JDK preinstalled on the runner image
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - uses: coursier/cache-action@v8

      - uses: coursier/setup-action@v3
        with:
          # No 'jvm: x', use the CI image one.
          apps: sbt

      - name: Verify scalaFmt and scalafix have been applied on the code
        run: sbt 'scalafmtCheckAll;scalafixAll --check'

      # Compute OSS CAD dir here as it is not available in job-level env.
      # We use the tool cache as it make caching easier.
      - name: Set OSS CAD Suite directory
        run: echo "OSS_CAD_DIR=$RUNNER_TOOL_CACHE/oss-cad-suite/$OSS_CAD_VERSION" >> "$GITHUB_ENV"

      - name: Cache OSS CAD Suite
        id: cache-oss-cad
        uses: actions/cache@v6
        with:
          path: ${{ env.OSS_CAD_DIR }}
          key: oss-cad-suite-pruned-${{ env.OSS_CAD_VERSION }}-${{ runner.os }}

      # Extract only that we need, to go from 2.6 GB to ~1 GB installed files.
      # We keep:
      # - verilator, iverilog, ghdl : SpinalSim backends
      # - yosys (+ synth_gatemate)   : synthesis
      # - nextpnr-himbaechel         : GateMate place & route
      # - sby, yices, z3             : SpinalHDL formal verification backend
      # tar --exclude skip the biggest chunks during extraction, the find
      # whitelist-complement below removes the rest to reduce cached size.
      - name: Install OSS cad suite
        if: steps.cache-oss-cad.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$OSS_CAD_DIR"
          curl -sL ${OSS_CAD_DOWNLOAD_URL}/${OSS_CAD_VERSION}/oss-cad-suite-linux-x64-${OSS_CAD_VERSION//[^0-9]/}.tgz \
            | tar xz -C "$OSS_CAD_DIR" --strip-components=1 \
                --exclude='oss-cad-suite/libexec/nextpnr-ice40' \
                --exclude='oss-cad-suite/libexec/nextpnr-ecp5' \
                --exclude='oss-cad-suite/libexec/nextpnr-machxo2' \
                --exclude='oss-cad-suite/libexec/nextpnr-nexus' \
                --exclude='oss-cad-suite/lib/python2.7' \
                --exclude='oss-cad-suite/share/icebox' \
                --exclude='oss-cad-suite/share/trellis' \
                --exclude='oss-cad-suite/examples' \
                --exclude='oss-cad-suite/super_prove'

          cd "$OSS_CAD_DIR"

          # Remove everything not whitelisted in bin/ and libexec/
          find bin -maxdepth 1 -mindepth 1 \
            ! -name 'yosys*' ! -name 'verilator*' ! -name 'iverilog*' ! -name 'vvp*' \
            ! -name 'ghdl*' ! -name 'sby' ! -name 'tabbypy3' ! -name 'yices*' ! -name 'z3*' \
            ! -name 'nextpnr-himbaechel*' -exec rm -rf {} +
          find libexec -maxdepth 1 -mindepth 1 \
            ! -name 'yosys*' ! -name 'verilator*' ! -name 'nextpnr-himbaechel*' \
            ! -name 'ivl*' ! -name 'ghdl*' ! -name 'vhdlpp*' ! -name 'z3*' ! -name 'yices*' \
            ! -name 'python3*' ! -name 'sby*' -exec rm -rf {} +

          # share/yosys must be kept whole : gatemate cells, ghdl/slang plugins,
          # and the sby_*.py modules used by SymbiYosys live in it.
          find share -maxdepth 1 -mindepth 1 \
            ! -name 'yosys' ! -name 'verilator' ! -name 'nextpnr' -exec rm -rf {} +
          rm -rf share/nextpnr/himbaechel/gowin

          # lib/ : python3.11 (needed by sby), LLVM (ghdl codegen), ghdl/iverilog
          # runtimes, plus the libs the bundled python dlopens. The EDA binaries
          # themselves are statically linked and do not need this tree.
          find lib -maxdepth 1 -mindepth 1 \
            ! -name 'python3.11*' ! -name 'libpython3.11*' ! -name 'libLLVM*' \
            ! -name 'ghdl*' ! -name 'libghdl*' ! -name 'ivl*' ! -name 'libvvp*' \
            ! -name 'ld-linux*' ! -name 'libz*' ! -name 'libffi*' ! -name 'libbz2*' \
            ! -name 'liblzma*' ! -name 'libssl*' ! -name 'libcrypto*' \
            ! -name 'libreadline*' ! -name 'libtinfo*' -exec rm -rf {} +

          rm -rf include examples

          echo "Pruned OSS CAD Suite size:"
          du -sh "$OSS_CAD_DIR"

      - name: Build and test
        run: |
          source "$OSS_CAD_DIR/environment"
          sbt test

      - name: Place & Route of Olimex VgaSoc
        run: |
          source "$OSS_CAD_DIR/environment"
          sbt runMain brenay.vgasoc.board.olimex.gatemate_a1_evb.Build



